name: Publicar a demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a pasta do site
        run: |
          cp -r public site
          cat > site/config.js <<'EOF'
          /* Versao publicada como demonstracao: sem projeto Supabase ligado.
             O app cai direto na tela que oferece a demo. */
          window.MEU_DINHEIRO = {
            supabaseUrl:     "COLE_AQUI_A_PROJECT_URL",
            supabaseAnonKey: "COLE_AQUI_A_ANON_KEY"
          };
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
